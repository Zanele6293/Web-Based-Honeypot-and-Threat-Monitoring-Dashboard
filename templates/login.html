<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Riverside Sun - Staff Portal</title>
    <!-- Bootstrap CSS Framework for rapid, responsive UI design -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Separate Custom Stylesheet linked dynamically via Flask's url_for -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">

    <!-- Main Authentication Container Card -->
    <div class="card shadow p-4 login-card">
        
        <!-- Header Branding: Hotel Information & Location -->
        <div class="text-center mb-3">
            <h4 class="fw-bold text-primary">Riverside Sun</h4>
            <p class="text-muted small mb-1">Southern Sun Staff & Management Portal</p>
            <span class="badge bg-secondary">Vanderbijlpark, Vaal River</span>
        </div>

        <!-- Navigation Tabs: Toggles between Log In and Sign Up views -->
        <ul class="nav nav-pills nav-fill mb-3">
            <li class="nav-item">
                <a class="nav-link active" href="/secret-admin-portal?action=login">Log In</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/secret-admin-portal?action=signup">Sign Up (New Staff)</a>
            </li>
        </ul>
        
        <!-- Conditional Error Message Alert (Triggers if authentication or WAF blocks occur) -->
        {% if error %}
            <div class="alert alert-danger text-center py-2 small" role="alert">
                {{ error }}
            </div>
        {% endif %}

        <!-- Core Authentication Form (Targeted by the Honeypot backend route) -->
        <form method="POST">
            <!-- Hidden input to track user intent (Log In vs Sign Up action type) -->
            <input type="hidden" name="form_type" value="{{ action.capitalize() if action else 'Login' }}">

            <!-- Staff Email Input Field -->
            <div class="mb-3">
                <label class="form-label small fw-bold">Staff Email Address</label>
                <input type="email" name="username" class="form-control" placeholder="e.g. taku.borerwe@southernsun.com" required autofocus>
            </div>
            
            <!-- Password / PIN Input Field (Monitored by WAF for payload injection signatures) -->
            <div class="mb-3">
                <label class="form-label small fw-bold">Password / PIN</label>
                <input type="password" name="password" class="form-control" placeholder="Enter password" required>
            </div>    

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary w-100">Secure Sign In</button>
        </form>

        <!-- Evaluator / Demo Helper Hint Box -->
        <div class="mt-4 pt-2 border-top text-center">
            <small class="text-muted demo-hint">💡 <strong>Demo Credentials Hint:</strong><br>
            Email: <code>zanele@southernsun.com</code><br>
            Password: <code>SunVaal2026!</code></small>
        </div>
        
    </div>

</body>
</html>
