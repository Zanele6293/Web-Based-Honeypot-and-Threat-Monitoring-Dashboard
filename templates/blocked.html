<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Access Denied - Security Firewall</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <div class="card bg-dark text-white p-5 shadow-lg border-danger text-center" style="width: 480px;">
        <h1 class="display-1 text-danger">🚫</h1>
        <h2 class="text-danger fw-bold">Access Blocked</h2>
        <p class="mt-3 text-light">{{ message }}</p>
        <hr class="border-danger">
        <p class="small text-muted mb-0">Riverside Sun automated Intrusion Prevention System (IPS). Contact IT security if this is a mistake.</p>
    </div>
    </body>
</html>
